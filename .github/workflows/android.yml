name: Android build & release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < version.txt)"
          fi
          echo "SCANIMAL_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
          # Publish when version.txt names a version that has no release yet (pushes to main only).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PUBLISH=true" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PUBLISH=true" >> $GITHUB_ENV
          else
            echo "PUBLISH=false" >> $GITHUB_ENV
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || V="$V-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "SCANIMAL_VERSION_NAME=$V" >> $GITHUB_ENV
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Scanimal-${SCANIMAL_VERSION_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Scanimal-${{ env.SCANIMAL_VERSION_NAME }}
          path: Scanimal-*.apk
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SCANIMAL_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Scanimal ${{ env.SCANIMAL_VERSION_NAME }}
          files: Scanimal-*.apk
          generate_release_notes: true
